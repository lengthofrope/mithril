x-common: &common
  container_name: mithril-whisper
  restart: unless-stopped
  ports:
    - "${WHISPER_CPP_PORT:-8080}:8080"
  volumes:
    - whisper-models:/models
  entrypoint: ["whisper-server", "--host", "0.0.0.0", "--port", "8080", "-m", "/models/${WHISPER_MODEL_FILE:-ggml-large-v3-turbo.bin}", "--convert"]

services:
  whisper:
    <<: *common
    image: ghcr.io/ggml-org/whisper.cpp:main
    profiles: ["cpu"]

  whisper-gpu:
    <<: *common
    image: ghcr.io/ggml-org/whisper.cpp:main-cuda
    profiles: ["cuda"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  whisper-vulkan:
    <<: *common
    image: ghcr.io/ggml-org/whisper.cpp:main-vulkan
    profiles: ["vulkan"]
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - whisper-models:/models
      - /usr/share/vulkan/icd.d:/usr/share/vulkan/icd.d:ro
      - /etc/vulkan/icd.d:/etc/vulkan/icd.d:ro

volumes:
  whisper-models:
    name: whispercpp_whisper-models
    external: true
